[project]
name = "wood-identification"
version = "1.0.0.dev0"
description = "Raman-spectroscopy wood species identification under small-n, tree-level evaluation"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.1",
    "pandas>=2.3",
    "pybaselines>=1.2",
    "scikit-learn>=1.7",
    "scipy>=1.16",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woodraman"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
