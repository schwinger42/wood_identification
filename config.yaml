# Wood Identification Configuration

# Data settings
data:
  raw_data_path: "data/raw/"
  processed_data_path: "data/processed/"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

# Preprocessing settings
preprocessing:
  baseline_correction: true
  baseline_method: "als"  # 'als' or 'polynomial'
  smoothing: true
  smoothing_window: 11
  smoothing_polyorder: 3
  normalization: true
  normalization_method: "standard"  # 'standard' or 'minmax'
  remove_cosmic_rays: true
  cosmic_ray_threshold: 3.0

# Feature extraction settings
features:
  extract_statistical: false
  extract_peaks: false
  use_full_spectrum: true

# Model settings - Machine Learning
ml_models:
  random_forest:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
  
  svm:
    C: 1.0
    kernel: "rbf"
    gamma: "scale"
  
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3

# Model settings - Deep Learning
dl_models:
  cnn:
    num_filters: [64, 128, 256]
    kernel_size: 5
    dropout: 0.5
  
  resnet:
    num_blocks: [2, 2, 2, 2]
    num_filters: [64, 128, 256, 512]
    dropout: 0.5
  
  mlp:
    hidden_sizes: [512, 256, 128]
    dropout: 0.5

# Training settings
training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.00001
  optimizer: "adam"
  scheduler: "reduce_on_plateau"
  early_stopping_patience: 10

# Evaluation settings
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1_score"]
  cross_validation_folds: 5
  save_confusion_matrix: true
  save_roc_curves: true
  save_feature_importance: true

# Output settings
output:
  model_save_path: "models/saved/"
  results_path: "results/"
  plots_path: "plots/"
  tensorboard_log_dir: "runs/"

# Logging settings
logging:
  log_level: "INFO"
  log_to_file: true
  log_file_path: "logs/training.log"
